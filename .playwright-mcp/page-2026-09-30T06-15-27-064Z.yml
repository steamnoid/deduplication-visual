          - paragraph [ref=e427]: Wszystkie próbki zgadzają się co do bajtu. Plik czytamy w kolejności zapisu chunków, więc w obrębie jednego kontenera idziemy sekwencyjnie — seeki to zmiany kontenera. Przy wielu kontenerach na dysku to właśnie one bolą i dlatego dedup układa chunki blisko siebie.